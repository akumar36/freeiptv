<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#7c3aed">
<title>IPTV Channels</title>
<meta name="description" content="1,100+ free TV channels tested in India. Copy the M3U link and paste it into the APTV app.">
<meta property="og:title" content="IPTV Channels – M3U Playlist">
<meta property="og:description" content="1,100+ free TV channels tested in India. Tap to copy the playlist link.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://akumar36.github.io/freeiptv/">
<meta property="og:image" content="https://akumar36.github.io/freeiptv/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="IPTV Channels: tap to copy the link">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://akumar36.github.io/freeiptv/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='12' y='18' width='40' height='28' rx='6' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M28 26l10 6-10 6z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --bg1: #7c3aed; --bg2: #db2777; --bg3: #f97316;
    --card: #ffffff; --text: #1f1235; --muted: #6b5f7d; --border: #ece6f5;
    --field: #f7f4fc; --accent1: #7c3aed; --accent2: #ec4899; --ok: #16a34a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%) fixed;
    background-color: var(--bg1);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 440px; }
  .card {
    background: var(--card); border-radius: 22px; padding: 28px 22px 24px;
    box-shadow: 0 20px 50px rgba(40, 10, 70, .28);
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .logo { width: 56px; height: 56px; flex: none; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 0 0 2.5px var(--accent2), 0 6px 14px rgba(124, 58, 237, .35); }
  h1 { font-size: 1.6rem; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  .tag { font-size: .8rem; font-weight: 600; color: var(--accent1); margin: 2px 0 0; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  label { display: block; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
  textarea {
    display: block; width: 100%; resize: none; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--field); color: var(--text);
    font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace; /* 16px stops iOS zoom on tap */
    word-break: break-all; overflow-wrap: anywhere;
  }
  button {
    display: block; width: 100%; margin-top: 12px; padding: 16px; min-height: 54px;
    border: 0; border-radius: 14px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent1), var(--accent2)); color: #fff;
    font-size: 1.1rem; font-weight: 700; letter-spacing: .01em;
    box-shadow: 0 8px 20px rgba(219, 39, 119, .3);
    transition: transform .08s ease;
  }
  button:active { transform: scale(.98); }
  button.done { background: var(--ok); box-shadow: 0 8px 20px rgba(22, 163, 74, .3); }
  .hint { color: var(--muted); font-size: .88rem; text-align: center; margin: 10px 0 0; min-height: 1.3em; }
  h2 { font-size: 1rem; margin: 22px 0 10px; }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  li { counter-increment: step; display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; color: var(--muted); font-size: .95rem; }
  li::before {
    content: counter(step); flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
  }
  li strong { color: var(--text); }
  .insta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 14px; padding: 14px; min-height: 52px; border-radius: 16px;
    background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .35);
    color: #fff; text-decoration: none; font-weight: 600;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .insta img { width: 28px; height: 28px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
  footer { text-align: center; color: rgba(255, 255, 255, .8); font-size: .78rem; margin-top: 14px; }
  footer a { color: inherit; }
  @media (max-width: 360px) {
    .card { padding: 22px 16px 20px; }
    h1 { font-size: 1.4rem; }
    .logo { width: 48px; height: 48px; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand">
      <img class="logo" src="profile.jpg" width="56" height="56" alt="@seltos.gtx">
      <div>
        <h1>IPTV Channels</h1>
        <p class="tag">1,100+ free channels · tested in India</p>
      </div>
    </div>

    <label for="link">Link</label>
    <textarea id="link" rows="3" readonly>https://raw.githubusercontent.com/akumar36/freeiptv/refs/heads/main/india.m3u</textarea>
    <button id="copy" type="button">Copy link</button>
    <p class="hint" id="hint" aria-live="polite"></p>

    <h2>How to use</h2>
    <ol>
      <li><span>Tap the <strong>"Copy link"</strong> button above.</span></li>
      <li><span>Open the <strong>APTV</strong> app.</span></li>
      <li><span>Paste the link and save.</span></li>
    </ol>
  </div>
  <a class="insta" href="https://www.instagram.com/seltos.gtx/" target="_blank" rel="noopener">
    <img src="profile.jpg" width="28" height="28" alt="">
    Follow @seltos.gtx on Instagram
  </a>
  <footer>Links from the public <a href="https://github.com/iptv-org/iptv">iptv-org</a> database. No video is hosted here.</footer>
</main>
<script>
  const box = document.getElementById("link");
  const btn = document.getElementById("copy");
  const hint = document.getElementById("hint");

  function legacyCopy() {
    box.focus();
    box.select();
    box.setSelectionRange(0, box.value.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    return ok;
  }

  btn.addEventListener("click", async () => {
    let ok = false;
    try {
      await navigator.clipboard.writeText(box.value);
      ok = true;
    } catch (e) {
      ok = legacyCopy();
    }
    if (ok) {
      btn.textContent = "✓ Copied!";
      btn.classList.add("done");
      hint.textContent = "Now paste it into the APTV app.";
      setTimeout(() => { btn.textContent = "Copy link"; btn.classList.remove("done"); }, 2500);
    } else {
      legacyCopy();
      hint.textContent = "Link selected. Long-press it and choose Copy.";
    }
  });

  box.addEventListener("focus", () => box.select());
</script>
</body>
</html>
